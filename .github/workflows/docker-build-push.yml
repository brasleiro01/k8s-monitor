name: Docker Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  MONITOR_IMAGE: vinnioliver66/k8s-monitor
  UI_IMAGE: vinnioliver66/k8s-monitor-ui

jobs:
  version:
    name: Gerar versão
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.gen.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar tag de versão
        id: gen
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')
          TAG="v${BASE}.${{ github.run_number }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Versão gerada: ${TAG}"

  # ------------------------------------------------------------------ #
  # Monitor Python                                                       #
  # ------------------------------------------------------------------ #
  build-monitor:
    name: Monitor (Python)
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./monitor
          file: ./monitor/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.MONITOR_IMAGE }}:${{ needs.version.outputs.tag }}
            ${{ env.MONITOR_IMAGE }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=monitor
          cache-to: type=gha,scope=monitor,mode=max

  # ------------------------------------------------------------------ #
  # Dashboard (React + Node.js)                                          #
  # ------------------------------------------------------------------ #
  build-ui:
    name: Dashboard (React + Node.js)
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.UI_IMAGE }}:${{ needs.version.outputs.tag }}
            ${{ env.UI_IMAGE }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

  # ------------------------------------------------------------------ #
  # Atualizar tags nos manifestos K8s                                    #
  # ------------------------------------------------------------------ #
  update-manifests:
    name: Atualizar manifestos K8s
    runs-on: ubuntu-latest
    needs: [version, build-monitor, build-ui]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar imagem do monitor em k8s/02-api.yaml
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          sed -i "s|image: ${{ env.MONITOR_IMAGE }}:.*|image: ${{ env.MONITOR_IMAGE }}:${TAG}|" k8s/02-api.yaml

      - name: Atualizar imagem do UI em k8s/03-ui.yaml
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          sed -i "s|image: ${{ env.UI_IMAGE }}:.*|image: ${{ env.UI_IMAGE }}:${TAG}|" k8s/03-ui.yaml

      - name: Commit e push
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/02-api.yaml k8s/03-ui.yaml
          git diff --staged --quiet && echo "Nenhuma alteração nos manifestos." || \
            git commit -m "ci: atualiza imagens para ${TAG}" && git push

  # ------------------------------------------------------------------ #
  # Summary                                                              #
  # ------------------------------------------------------------------ #
  summary:
    name: Resumo
    runs-on: ubuntu-latest
    needs: [version, update-manifests]
    if: github.event_name != 'pull_request'
    steps:
      - name: Exibir versão publicada
        run: |
          echo "### ✅ Imagens publicadas com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`vinnioliver66/k8s-monitor\` | \`${{ needs.version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`vinnioliver66/k8s-monitor-ui\` | \`${{ needs.version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Manifestos atualizados: \`k8s/02-api.yaml\` e \`k8s/03-ui.yaml\`" >> $GITHUB_STEP_SUMMARY
