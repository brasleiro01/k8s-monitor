name: Docker Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  IMAGE: vinnioliver66/k8s-monitor

jobs:
  version:
    name: Gerar versão
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.gen.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar tag de versão
        id: gen
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')
          TAG="v${BASE}.${{ github.run_number }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Versão gerada: ${TAG}"

  # ------------------------------------------------------------------ #
  # Build único — Python FastAPI + React (multi-stage)                  #
  # ------------------------------------------------------------------ #
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  # ------------------------------------------------------------------ #
  # Atualizar tag no manifesto K8s                                       #
  # ------------------------------------------------------------------ #
  update-manifests:
    name: Atualizar manifesto K8s
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar imagem em k8s/02-monitor.yaml
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          sed -i "s|image: ${{ env.IMAGE }}:.*|image: ${{ env.IMAGE }}:${TAG}|" k8s/02-monitor.yaml

      - name: Commit e push
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/02-monitor.yaml
          git diff --staged --quiet && echo "Nenhuma alteração." || \
            git commit -m "ci: atualiza imagem para ${TAG}" && git push

  # ------------------------------------------------------------------ #
  # Summary                                                              #
  # ------------------------------------------------------------------ #
  summary:
    name: Resumo
    runs-on: ubuntu-latest
    needs: [version, update-manifests]
    if: github.event_name != 'pull_request'
    steps:
      - name: Exibir versão publicada
        run: |
          echo "### ✅ Imagem publicada com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`vinnioliver66/k8s-monitor\` | \`${{ needs.version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Manifesto atualizado: \`k8s/02-monitor.yaml\`" >> $GITHUB_STEP_SUMMARY
