apiVersion: v1
kind: Namespace
metadata:
  name: k8s-monitor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-monitor
  namespace: k8s-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-monitor-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-monitor-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-monitor-reader
subjects:
  - kind: ServiceAccount
    name: k8s-monitor
    namespace: k8s-monitor
