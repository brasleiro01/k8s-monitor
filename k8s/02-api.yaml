apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-monitor
  namespace: k8s-monitor
  labels:
    app: k8s-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-monitor
  template:
    metadata:
      labels:
        app: k8s-monitor
    spec:
      serviceAccountName: k8s-monitor
      containers:
        - name: monitor
          image: vinnioliver66/k8s-monitor:v1.0.18
          imagePullPolicy: Always
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-secrets
                  key: gemini-api-key
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-secrets
                  key: discord-webhook-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-secrets
                  key: DATABASE_URL
            - name: NAMESPACES
              value: ""
            - name: GEMINI_MODEL
              value: "gemini-2.0-flash"
            - name: ERROR_COOLDOWN_SECONDS
              value: "3600"
            - name: MAX_DAILY_ALERTS
              value: "5"
            - name: CONTEXT_LINES
              value: "10"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
