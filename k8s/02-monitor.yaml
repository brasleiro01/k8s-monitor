apiVersion: v1
kind: Service
metadata:
  name: k8s-monitor
  namespace: k8s-monitor
spec:
  selector:
    app: k8s-monitor
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-monitor
  namespace: k8s-monitor
spec:
  rules:
    - host: k8s-monitor.mvps.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-monitor
                port:
                  number: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-monitor
  namespace: k8s-monitor
  labels:
    app: k8s-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-monitor
  template:
    metadata:
      labels:
        app: k8s-monitor
    spec:
      serviceAccountName: k8s-monitor
      volumes:
        - name: sa-token
          secret:
            secretName: k8s-monitor-sa-token
      containers:
        - name: app
          image: vinnioliver66/k8s-monitor:v1.0.27
          imagePullPolicy: Always
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          ports:
            - containerPort: 8000
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-secrets
                  key: gemini-api-key
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-secrets
                  key: discord-webhook-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-secrets
                  key: DATABASE_URL
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-secrets
                  key: google-client-id
                  optional: true
            - name: NAMESPACES
              value: ""
            - name: GEMINI_MODEL
              value: "gemini-2.0-flash"
            - name: ERROR_COOLDOWN_SECONDS
              value: "3600"
            - name: MAX_DAILY_ALERTS
              value: "5"
            - name: CONTEXT_LINES
              value: "10"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DB_SSL
              value: "0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/config
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/config
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
